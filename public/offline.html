<!doctype html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#16877f">
    <title>LaundryKu — Offline</title>
    <style>
        :root { color-scheme: light; font-family: Inter, system-ui, sans-serif; background: #f8fafc; color: #0f172a; }
        body { display: grid; min-height: 100vh; margin: 0; place-items: center; padding: 24px; }
        main { max-width: 420px; text-align: center; }
        .mark { display: inline-grid; width: 56px; height: 56px; place-items: center; border-radius: 18px; background: #16877f; color: white; font-size: 28px; font-weight: 700; }
        h1 { margin: 20px 0 8px; font-size: 24px; }
        p { color: #64748b; line-height: 1.6; }
        a { display: inline-block; margin-top: 16px; border-radius: 12px; background: #16877f; color: white; padding: 12px 18px; text-decoration: none; font-weight: 600; }
    </style>
</head>
<body>
    <main>
        <span class="mark">L</span>
        <h1>Anda sedang offline</h1>
        <p>Katalog publik mungkin masih tersedia. Koneksi internet diperlukan untuk membuat atau memperbarui pesanan.</p>
        <a href="/">Kembali ke beranda</a>
    </main>

</html>
