name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, fileinfo, intl, mbstring, pdo_sqlite, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install PHP dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Check PHP formatting
        run: vendor/bin/pint --test

      - name: Check Composer dependencies
        run: composer validate --strict && composer audit

      - name: Check npm dependencies
        run: npm audit

      - name: Run tests
        run: php artisan test

      - name: Build frontend and PWA
        run: npm run build
